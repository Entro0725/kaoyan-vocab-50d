  if(grade>=2 && p.lastSuccessDate!==today)successDays++;
  return {
    firstStudied:p.firstStudied||today,
    lastStudied:today,
    dueAt:nowMillis+delayMs,
    intervalDays,
    streak,
    successDays,
    lastSuccessDate:grade>=2?today:(p.lastSuccessDate||''),
    reps:Number(p.reps||0)+1,
    lapses:Number(p.lapses||0)+(grade===0?1:0),
    lastGrade:grade,
  };
}
function dailyStats(vocab,state,at=new Date()){
  const now=at instanceof Date?at:new Date(at), today=localDateKey(now), nowMillis=now.getTime();
  const pool=eligibleWords(vocab,state.settings.goal);
  const passed=daysSince(state.startedOn,today);
  const remainingLearnDays=Math.max(0,LEARN_DAYS-passed);
  let seen=0,learnedToday=0,due=0,masteredCount=0,hard=0;
  for(const w of pool){
    const c=state.cards[w.id];
    if(!c)continue;
    seen++;
    if(c.firstStudied===today)learnedToday++;
    if(isDue(c,nowMillis))due++;
    if(mastered(c))masteredCount++;
    if(c.lapses>0)hard++;
  }
  const unseen=pool.length-seen;
  const baseDaily=remainingLearnDays?Math.ceil((unseen+learnedToday)/remainingLearnDays):0;
  const bonus=state.bonusDate===today?Number(state.settings.bonus||0):0;
  const newQuota=baseDaily+bonus;
  const todayEvents=(state.events||[]).filter(e=>localDateKey(e.t)===today);
  const reviewedToday=todayEvents.filter(e=>!e.new).length;
  const reviewTarget=boundedSetting(state.settings.reviewTarget,100,1,500);
  const reviewBatch=boundedSetting(state.settings.reviewBatch,100,1,500);
  return {
    today,day:passed+1,daysRemaining:Math.max(0,PLAN_DAYS-passed),remainingLearnDays,
    goal:getGoal(state.settings.goal),poolSize:pool.length,seen,unseen,due,
    mastered:masteredCount,hard,learnedToday,reviewedToday,reviewTarget,reviewBatch,reviewRemaining:Math.max(0,reviewTarget-reviewedToday),
    baseDaily,newQuota,newRemaining:Math.max(0,newQuota-learnedToday),
    totalProgress:pool.length?Math.round(seen*100/pool.length):0,
    masteryProgress:pool.length?Math.round(masteredCount*100/pool.length):0
  };
}
function sessionWords(vocab,state,mode='mixed',at=new Date()){
  const pool=eligibleWords(vocab,state.settings.goal),now=at instanceof Date?at.getTime():new Date(at).getTime();
  const stats=dailyStats(vocab,state,at);
  const due=pool.filter(w=>isDue(state.cards[w.id],now))
    .sort((a,b)=>(state.cards[a.id].dueAt-state.cards[b.id].dueAt)||(a.id-b.id));
  const newWords=pool.filter(w=>!state.cards[w.id]).slice(0,stats.newRemaining);
  const batch=stats.reviewBatch;
  if(mode==='low')return vocab.filter(w=>w.score===1&&!state.cards[w.id]).slice(0,10);
  if(mode==='review')return due.slice(0,batch);
  if(mode==='practice'){
    // Extra voluntary practice can include studied cards that aren't due yet.
    // Due cards are always first, followed by upcoming cards in original order.
    return [...due,...pool.filter(w=>state.cards[w.id]&&!isDue(state.cards[w.id],now))].slice(0,batch);
  }
  if(mode==='new')return newWords;
  if(mode==='favorites')return pool.filter(w=>state.favorites.includes(w.id));
  return [...due.slice(0,batch),...newWords];
}

function speak(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('当前浏览器不支持语音朗读');return;}
  try{
    const synth=window.speechSynthesis;
    synth.cancel();
    const phrase=String(text).replace(/\s*\/\s*/g,', ');
    const utterance=new SpeechSynthesisUtterance(phrase);
    utterance.lang=progress.settings.accent||'en-US';
    utterance.rate=Math.max(.6,Math.min(1.2,Number(progress.settings.speed)||.88));
    const voices=synth.getVoices();
    const exact=voices.find(v=>v.lang.toLowerCase()===(utterance.lang.toLowerCase()));
    const fallback=voices.find(v=>v.lang.toLowerCase().startsWith('en'));
    if(exact||fallback)utterance.voice=exact||fallback;
    utterance.onerror=()=>toast('语音播放失败，请检查浏览器或设备的语音设置');
    synth.speak(utterance);
  }catch(error){console.warn(error);toast('语音服务暂不可用');}
}

function rate(grade){
  const word=currentCard();if(!word||!revealed)return;
  const now=new Date(),prev=progress.cards[word.id];
  const isExtraPractice=session.mode==='practice' && prev && !isDue(prev,now.getTime());
  if(isExtraPractice && grade!==0){
    // Extra review must not artificially push the next spaced-repetition date.
    progress.cards[word.id]={...prev,lastStudied:localDateKey(now),lastGrade:grade,reps:Number(prev.reps||0)+1};
  }else{
    progress.cards[word.id]=scheduleCard(prev,grade,now,{lapseMinutes:progress.settings.lapseMinutes});
  }
  progress.events.push({t:now.toISOString(),id:word.id,grade,new:!prev});
  if(progress.events.length>35000)progress.events.splice(0,progress.events.length-35000);
  save();session.index++;session.answered++;revealed=false;render();
  if(progress.settings.autoSpeak&&currentCard())speak(currentCard().word);
}

function renderInsights(s){
  const days=lastDays(7),counts=days.map(day=>progress.events.filter(e=>localDateKey(e.t)===day).length),top=Math.max(8,...counts);
  const struggling=eligibleWords(vocab,progress.settings.goal).filter(w=>progress.cards[w.id]?.lapses>0).sort((a,b)=>progress.cards[b.id].lapses-progress.cards[a.id].lapses||a.id-b.id).slice(0,10);
  return `<div class="eyebrow">LEARNING ANALYTICS</div><h1 class="page-title">你已经走了多远</h1><p class="lead">每天的积累会变成长期记忆。掌握并不等于看过一次，而是跨天成功回忆至少两次。</p>
  <div class="grid3"><section class="card metric"><div class="label">已学</div><div class="big">${formatNum(s.seen)}</div><div class="foot">${s.totalProgress}%</div></section><section class="card metric"><div class="label">掌握</div><div class="big green">${formatNum(s.mastered)}</div><div class="foot">${s.masteryProgress}%</div></section><section class="card metric"><div class="label">总回答</div><div class="big accent">${formatNum(progress.events.length)}</div><div class="foot">含重复复习</div></section></div>
  <div class="spacer"></div><section class="card progress-card"><div class="flex-between"><strong>50 天冲刺</strong><span class="small">第 ${s.day} 天</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct((s.day-1)/50*100)}%"></div></div><div class="progress-meta"><span>新词期：第 1—42 天</span><span>巩固期：第 43—50 天</span></div></section>
  <div class="heading-row"><h2>近 7 天答题次数</h2><span class="small">每一次主动回忆都算一次练习</span></div><section class="card form-card"><div class="bar-chart">${days.map((d,i)=>`<div class="chart-col"><span>${counts[i]}</span><div class="bar ${counts[i]===0?'zero':''}" style="height:${Math.max(4,Math.round(counts[i]/top*120))}px"></div><span>${d.slice(5)}</span></div>`).join('')}</div></section>
  <div class="heading-row"><h2>需要加固的单词</h2><span class="small">按忘记次数排列</span></div>
  <section class="card form-card">${struggling.length?struggling.map(w=>`<div class="setting-row"><div><strong>${escapeHtml(w.word)}</strong><small>${escapeHtml(w.meaning)}</small></div><span class="badge-light">忘记 ${progress.cards[w.id].lapses} 次</span></div>`).join(''):'<p style="margin:0">还没有反复遗忘的单词，开始第一次练习后，这里会自动更新。</p>'}</section>
  <div class="tip"><span class="bulb">✦</span><span>建议先做当天到期复习，再学新词。新词完成数量只是过程指标，<b>过几天还能准确回忆</b>才是目标。</span></div>`;
}
function renderSettings(stats){
  return `<div class="eyebrow">YOUR STUDY SYSTEM</div><h1 class="page-title">让计划适合你</h1><p class="lead">从今天开始算 50 天；前 42 天按考频顺序认识新词，后 8 天集中巩固。所有更改即时保存。</p>
    <section class="card form-card"><h3>词频目标</h3><p>先完成大于 3 次的词，再增加 3 次、2 次和低频词。切换目标不会抹掉你之前的复习记录。</p><label class="form-label" for="goal">选择每日计划覆盖范围</label><select class="field" id="goal" data-setting="goal">${GOALS.map(g=>`<option value="${g.id}" ${progress.settings.goal===g.id?'selected':''}>${g.label}（${formatNum(eligibleWords(vocab,g.id).length)} 词）</option>`).join('')}</select><div class="divider"></div><div class="stat-table"><span>已开始日期</span><strong>${escapeHtml(progress.startedOn)}</strong><span>剩余新词</span><strong>${formatNum(stats.unseen)} 词</strong><span>建议每日新词</span><strong>${stats.baseDaily} 词</strong></div></section>
    <section class="card form-card"><h3>自定义复习计划</h3><p>你可以每天复习 100 次、120 次或自己设定的数量。一次回答记为一次；到期复习优先，不足时可通过「自由复习」加练，不强迫凑次数。</p>
      <div class="setting-row"><label for="reviewTarget">每日复习目标<small>可设 1–500 次，今日完成 ${stats.reviewedToday} 次</small></label><input class="field number-field" id="reviewTarget" type="number" inputmode="numeric" min="1" max="500" step="1" data-setting="reviewTarget" value="${stats.reviewTarget}" /></div>
      <div class="setting-row"><label for="reviewBatch">每轮最多复习<small>例如 100 或 120 次，避免一轮太长</small></label><input class="field number-field" id="reviewBatch" type="number" inputmode="numeric" min="1" max="500" step="1" data-setting="reviewBatch" value="${stats.reviewBatch}" /></div>
      <div class="setting-row"><label for="lapseMinutes">点击「不会」后多久复习<small>5 分钟、10 分钟，或自定 1–120 分钟</small></label><select class="field" id="lapseMinutes" data-setting="lapseMinutes">${[5,10,15,20,30,60].concat([boundedSetting(progress.settings.lapseMinutes,10,1,120)]).filter((n,i,a)=>a.indexOf(n)===i).sort((a,b)=>a-b).map(m=>`<option value="${m}" ${boundedSetting(progress.settings.lapseMinutes,10,1,120)===m?'selected':''}>${m} 分钟</option>`).join('')}</select></div>
      <div class="setting-row"><label for="customLapse">自定义分钟数<small>填写后自动覆盖上方选项</small></label><input class="field number-field" id="customLapse" type="number" inputmode="numeric" min="1" max="120" step="1" placeholder="例如 5 或 10" data-setting="customLapse" /></div>
      <p class="footnote">复习目标是计划，不是强制上限。单次批量限制只影响组队数量；本来已经排好的到期时间不因改设置而追溯改变。</p></section>
    <section class="card form-card"><h3>发音设置</h3><p>使用浏览器提供的英语朗读，不再使用内置离线语音。实际音质和可用声音取决于你的浏览器及设备。</p>
      <div class="setting-row"><label for="accent">发音口音<small>优先选用设备提供的对应语音</small></label><select class="field" id="accent" data-setting="accent"><option value="en-US" ${progress.settings.accent==='en-US'?'selected':''}>美式英语</option><option value="en-GB" ${progress.settings.accent==='en-GB'?'selected':''}>英式英语</option></select></div>
      <div class="setting-row"><label for="speed">朗读速度</label><select class="field" id="speed" data-setting="speed">${[[0.7,'较慢 · 0.7x'],[0.88,'舒适 · 0.88x'],[1,'正常 · 1.0x'],[1.12,'稍快 · 1.12x']].map(([s,t])=>`<option value="${s}" ${Number(progress.settings.speed)===s?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="setting-row"><label for="autoSpeak">每张词卡自动朗读<small>部分手机浏览器需手动点击播放</small></label><input id="autoSpeak" type="checkbox" data-setting="autoSpeak" ${progress.settings.autoSpeak?'checked':''}/></div>
      <button class="button soft small-btn" data-action="test-speech">◖)) 试听 ability</button></section>
    <section class="card form-card"><h3>备份与迁移</h3><p>记录保存在本机浏览器中，没有账号、服务器或跨设备自动同步。换手机前必须导出，再在另一台设备导入。</p><div class="two-buttons"><button class="button primary" data-action="export">↓ 导出学习记录</button><button class="button outline" data-action="import">↑ 导入学习记录</button></div><div class="divider"></div><button class="button outline small-btn" data-action="install">安装到主屏幕</button></section>
    <section class="card form-card"><h3>重新开始</h3><p>会删除本设备当前的学习记录，并从今天重新计算 50 天。请先导出备份。</p><button class="button outline small-btn" data-action="reset" style="color:#c24e4c">清空本地学习进度</button></section>
    <p class="footnote">精简释义完全来自你提供的《词汇乱序·释义精简版》，词频未重新统计。记忆算法是基于间隔复习的简化规则，不代表严格的 FSRS 算法。语音是否可离线使用取决于设备及已安装的英语语音包。</p>`;
}

function downloadBlob(filename,text,type='application/json'){
  if(window.__kaoyanNativeExport?.supported){
    window.__kaoyanNativeExport.export(filename,text).catch(e=>{console.warn('Native export',e);toast('分享备份失败，请检查手机文件应用');});
    return;
  }
  const blob=new Blob([text],{type:`${type};charset=utf-8`});
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='nav'){switchView(button.dataset.view);return;}
  if(action==='new-session'){session=null;revealed=false;switchView('study');return;}
  if(action==='start'){startSession(button.dataset.mode||'mixed');return;}
  if(action==='reveal'){revealed=true;render();return;}
  if(action==='rate'){rate(Number(button.dataset.grade));return;}
  if(action==='speak'){const w=vocab[Number(button.dataset.id)-1];if(w)speak(w.word);return;}
  if(action==='test-speech'){speak('ability');return;}
  if(action==='star'){toggleFavorite(Number(button.dataset.id));return;}
  if(action==='mnemonic'){
    const id=Number(button.dataset.id);const w=vocab[id-1];if(!w)return;
    const note=window.prompt(`给 ${w.word} 写一句自己能联想到的短提示（留空可删除）`,progress.mnemonics?.[id]||'');
    if(note!==null){progress.mnemonics ||= {};const clean=note.trim().slice(0,160);if(clean)progress.mnemonics[id]=clean;else delete progress.mnemonics[id];save();render();}return;
  }
  if(action==='bonus'){
    const today=localDateKey();if(progress.bonusDate!==today){progress.bonusDate=today;progress.settings.bonus=0;}
    progress.settings.bonus=Math.min(250,Number(progress.settings.bonus||0)+10);
    save();render();toast('今日新词额度 +10');return;
  }
  if(action==='list-page'){listPage=Math.max(1,listPage+Number(button.dataset.delta));render();window.scrollTo(0,0);return;}
  if(action==='export'){
    const payload={app:'kaoyan-vocab-50d',exportedAt:new Date().toISOString(),vocabCount:4924,progress};
    downloadBlob(`考研词汇学习记录_${localDateKey()}.json`,JSON.stringify(payload,null,2));toast('学习记录备份已生成');return;
  }
  if(action==='import'){document.getElementById('import-file').click();return;}
  if(action==='reset'){
    if(window.confirm('确定清空本机所有背词记录？此操作不可撤销，请先导出备份。')){
      progress=makeInitialState();save();session=null;render();toast('已从今天重新开始');
    }return;
  }
  if(action==='install'){
    if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>{installPrompt=null;});}
    else toast('手机可通过浏览器菜单「添加到主屏幕」安装');
  }
});

document.addEventListener('input',event=>{
  if(event.target.id==='word-search'){
    listSearch=event.target.value;listPage=1;
    const result=document.getElementById('word-results');if(result)result.innerHTML=renderWordResults();
  }
});
document.addEventListener('change',event=>{
  const t=event.target;
  if(t.id==='list-filter'){listFilter=t.value;listPage=1;render();return;}
  const setting=t.dataset.setting;
  if(!setting)return;
  if(setting==='goal'){progress.settings.goal=GOALS.find(g=>g.id===t.value)?.id||'core';session=null;}
  if(setting==='accent')progress.settings.accent=t.value==='en-GB'?'en-GB':'en-US';
  if(setting==='speed')progress.settings.speed=Number(t.value)||.88;
  if(setting==='autoSpeak')progress.settings.autoSpeak=t.checked;
  if(setting==='reviewTarget')progress.settings.reviewTarget=boundedSetting(t.value,100,1,500);
  if(setting==='reviewBatch'){progress.settings.reviewBatch=boundedSetting(t.value,100,1,500);session=null;}
  if(setting==='lapseMinutes'||setting==='customLapse')progress.settings.lapseMinutes=boundedSetting(t.value,10,1,120);
  save();render();
});
window.addEventListener('keydown',event=>{
  if(view!=='study'||!session||event.altKey||event.ctrlKey||event.metaKey)return;
  const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(event.code==='Space'){event.preventDefault();if(currentCard()&&!revealed){revealed=true;render();}}
  else if(event.key.toLowerCase()==='p'){if(currentCard())speak(currentCard().word);}
  else if(revealed&&['1','2','3','4'].includes(event.key)){rate(Number(event.key)-1);}
});
// Recheck the queue while this view is open: a failed card becomes due after 5/10 minutes.
setInterval(()=>{
  if(!vocab.length||view!=='study'||!session||session.index<session.ids.length)return;
  const due=sessionWords(vocab,progress,'review',new Date());
  if(due.length){startSession('review');toast('到期复习已自动开始');}
  else render();
},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&vocab.length)render();});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
document.getElementById('import-file').addEventListener('change',async event=>{
  const file=event.target.files?.[0];if(!file)return;
  try{
    if(file.size>10*1024*1024)throw Error('备份文件过大');
    const payload=JSON.parse(await file.text());
    if(payload.app!=='kaoyan-vocab-50d'||payload.vocabCount!==4924)throw Error('这不是本应用的 4924 词备份');
    const p=payload.progress;
    if(p?.version!==1||!/^\d{4}-\d{2}-\d{2}$/.test(p.startedOn)||typeof p.cards!=='object'||!p.cards||!Array.isArray(p.events)||!Array.isArray(p.favorites))throw Error('进度数据不完整');
    if(!window.confirm('导入会覆盖当前设备的学习记录，确定继续？'))return;
    progress={...makeInitialState(),...p,settings:{...makeInitialState().settings,...p.settings}};
    save();session=null;view='home';render();toast('学习记录导入成功');
  }catch(error){toast(`导入失败：${error.message}`);}finally{event.target.value='';}
});

async function init(){
  try{
    const response={ok:true,json:async()=>window.__vocab};
    if(!response.ok)throw Error(`HTTP ${response.status}`);
    vocab=await response.json();
    if(vocab.length!==4924||vocab[0].id!==1||vocab[4923].id!==4924)throw Error('词表校验失败');
    progress=readState();render();
    if(false){
      navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('离线缓存不可用',e));
    }
  }catch(error){console.error(error);root.innerHTML=`<section class="card empty-state"><div class="empty-icon">!</div><h3>词表未能加载</h3><p>${escapeHtml(error.message)}<br>请通过本地 HTTP 服务或 GitHub Pages 打开，勿直接双击 HTML 文件。</p></section>`;}
}
init();
